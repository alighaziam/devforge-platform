spring:
  application:
    name: devforge-platform-core

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: DevForge Platform Core
    description: Enterprise Application Engineering Platform
    version: 0.1.0-SNAPSHOT

---
spring:
  config:
    activate:
      on-profile: local

logging:
  level:
    io.devforge: DEBUG
