name: Platform CI

on:
  push:
    branches: [main]
    paths:
      - 'pom.xml'
      - 'platform/**'
      - '.github/workflows/platform-ci.yml'
  pull_request:
    paths:
      - 'pom.xml'
      - 'platform/**'
      - '.github/workflows/platform-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-platform:
    name: Java 25 platform build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify platform
        run: mvn --batch-mode --no-transfer-progress verify
