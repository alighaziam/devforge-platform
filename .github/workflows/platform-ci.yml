name: Platform CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'docs/**']
    paths:
      - 'pom.xml'
      - 'platform/**'
      - 'studio/**'
      - 'schemas/**'
      - 'catalogs/**'
      - 'docs/**'
      - '.github/workflows/platform-ci.yml'
  pull_request:
    paths:
      - 'pom.xml'
      - 'platform/**'
      - 'studio/**'
      - 'schemas/**'
      - 'catalogs/**'
      - 'docs/**'
      - '.github/workflows/platform-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-platform:
    name: Java 25 platform build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify platform
        run: mvn --batch-mode --no-transfer-progress verify

  studio:
    name: Angular Studio build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: studio
        run: npm install --no-audit --no-fund
      - name: Build Studio
        working-directory: studio
        run: npm run build
      - name: Upload generated dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: studio-package-lock
          path: studio/package-lock.json
          if-no-files-found: error
