name: Platform CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'docs/**']
    paths:
      - 'pom.xml'
      - 'platform/**'
      - 'studio/**'
      - 'schemas/**'
      - 'catalogs/**'
      - 'docs/**'
      - '.github/workflows/platform-ci.yml'
  pull_request:
    paths:
      - 'pom.xml'
      - 'platform/**'
      - 'studio/**'
      - 'schemas/**'
      - 'catalogs/**'
      - 'docs/**'
      - '.github/workflows/platform-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-platform:
    name: Java 25 platform build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify platform
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Build generated sample project
        run: |
          mkdir -p target/generated-sample
          unzip -l platform/core/target/devforge-generated-sample.zip
          unzip -q platform/core/target/devforge-generated-sample.zip -d target/generated-sample
          find target/generated-sample/src/main/resources -type f -print
          test -s target/generated-sample/src/main/resources/db/migration/V1__create_domain_schema.sql
          grep -q 'CREATE TABLE customer' target/generated-sample/src/main/resources/db/migration/V1__create_domain_schema.sql
          mvn --batch-mode --no-transfer-progress -f target/generated-sample/pom.xml verify
          find target/generated-sample/target/classes -type f -print
      - name: Verify generated migration is packaged
        run: |
          jar tf target/generated-sample/target/*.jar | grep 'BOOT-INF/classes/db/migration/V1__create_domain_schema.sql'
      - name: Run generated sample runtime smoke test
        run: |
          cd target/generated-sample
          cleanup() { docker compose down --volumes --remove-orphans; }
          trap cleanup EXIT
          docker compose up --build --detach
          for attempt in $(seq 1 36); do
            if curl --fail --silent http://localhost:8080/actuator/health; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs
          exit 1

  studio:
    name: Angular Studio build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Install dependencies
        working-directory: studio
        run: npm ci --no-audit --no-fund
      - name: Build Studio
        working-directory: studio
        run: npm run build
